# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Repository-level CodeRabbit settings.
#
# A committed .coderabbit.yaml (priority 2) overrides the CodeRabbit
# organization UI settings (priority 5), which skip every PR without the
# coderabbit-ready label. Organization global overrides (priority 1) still
# win over this file. Configuration inheritance is off by default, so a
# setting not listed here and not set by a global override uses CodeRabbit's
# schema default.
#
# Docs: https://docs.coderabbit.ai/configuration/auto-review
#       https://docs.coderabbit.ai/guides/configuration-overview
reviews:
  auto_review:
    # Review PRs automatically, with no label gate.
    enabled: true
    labels: []
    # Fleet PRs open as drafts, so include them.
    drafts: true
    # The default branch (main) is always reviewed. Also review PRs that
    # target this fork's dev integration branch, and develop, which
    # CONTRIBUTING.md names as the upstream PR target.
    base_branches:
      - "^dev$"
      - "^develop$"
      - "^main$"

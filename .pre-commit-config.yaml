repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lock-step with the ruff range pinned in BOTH
    # .github/workflows/ci.yml and pyproject.toml's dev/lint extras
    # (>=0.15.9,<0.16). There are THREE pin sites; a mismatched rev here
    # silently re-reformats staged files mid-commit and aborts the commit
    # (mempalace#37).
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: markdown-links
        name: markdown link integrity
        entry: pwsh -NoProfile -File scripts/check-markdown-links.ps1
        language: system
        files: \.(md|mdx)$
        pass_filenames: false
